<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friend Activity</title>
<style>
  :root {
    --bg: #0b0b0b;
    --card: #171717;
    --card-hover: #1f1f1f;
    --line: #262626;
    --text: #ffffff;
    --muted: #a8a8a8;
    --dim: #6c6c6c;
    --green: #1ed760;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1b1b1b, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1220px; margin: 0 auto; padding: 0 24px; }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11, 11, 11, .82);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }

  .bar { display: flex; align-items: center; gap: 14px; height: 72px; }

  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    animation: pulse 2.4s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(30, 215, 96, .55); }
    70%  { box-shadow: 0 0 0 9px rgba(30, 215, 96, 0); }
    100% { box-shadow: 0 0 0 0 rgba(30, 215, 96, 0); }
  }

  .sub { color: var(--dim); font-size: 13px; }
  .spacer { flex: 1; }

  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: #ffffff14;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }

  button:hover:not(:disabled) { background: #ffffff22; border-color: #3a3a3a; }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }

  main { padding: 26px 0 70px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 12px;
  }

  .card {
    display: flex;
    gap: 14px;
    padding: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: background .15s, border-color .15s, transform .15s;
    animation: rise .35s ease both;
  }

  .card:hover {
    background: var(--card-hover);
    border-color: #333;
    transform: translateY(-1px);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .art {
    position: relative;
    flex: 0 0 64px;
    width: 64px; height: 64px;
    border-radius: 10px;
    overflow: hidden;
    background: #0f0f0f;
    border: 1px solid #222;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
    font-size: 22px;
  }

  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .body { min-width: 0; flex: 1; }

  .row1 { display: flex; align-items: baseline; gap: 8px; }

  .user {
    font-weight: 650;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .time {
    margin-left: auto;
    flex: 0 0 auto;
    color: var(--dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  .track {
    display: block;
    margin-top: 2px;
    font-size: 14px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  a.track:hover { color: var(--green); text-decoration: underline; }

  .artist, .ctx {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
    font-size: 13px;
  }

  .artist { margin-top: 1px; }

  .ctx {
    margin-top: 5px;
    color: var(--dim);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctx svg { flex: 0 0 auto; opacity: .75; }

  .skeleton {
    height: 94px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: linear-gradient(100deg, #151515 30%, #1e1e1e 50%, #151515 70%);
    background-size: 300% 100%;
    animation: shimmer 1.3s infinite linear;
  }

  @keyframes shimmer {
    from { background-position: 100% 0; }
    to   { background-position: -100% 0; }
  }

  .empty, .error {
    grid-column: 1 / -1;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 34px 26px;
    text-align: center;
    font-size: 14px;
  }

  .empty { color: var(--muted); background: var(--card); }
  .empty strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 15px; }

  .error {
    color: #ffb4b4;
    background: #2a1414;
    border-color: #4a2020;
    text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .error strong {
    display: block;
    font-family: inherit;
    color: #ff8a8a;
    margin-bottom: 8px;
    font-size: 13px;
  }

  footer {
    margin-top: 22px;
    color: var(--dim);
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 560px) {
    .wrap { padding: 0 14px; }
    .grid { grid-template-columns: 1fr; }
    .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <h1><span class="dot" aria-hidden="true"></span>Friend Activity</h1>
    <span class="sub" id="summary">Loading…</span>
    <span class="spacer"></span>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
  <footer id="footer">Auto-refreshes every 60 seconds</footer>
</main>

<script>
  const grid = document.getElementById('grid')
  const summary = document.getElementById('summary')
  const footer = document.getElementById('footer')
  const refresh = document.getElementById('refresh')

  const REFRESH_MS = 60 * 1000
  const TICK_MS = 20 * 1000

  let loading = false
  let lastUpdated = null

  function timeAgo (ms) {
    const seconds = Math.max(0, Math.round((Date.now() - ms) / 1000))
    if (seconds < 45) return 'just now'
    const minutes = Math.round(seconds / 60)
    if (minutes < 60) return minutes + ' min ago'
    const hours = Math.round(minutes / 60)
    if (hours < 24) return hours + ' h ago'
    return Math.round(hours / 24) + ' d ago'
  }

  function spotifyUrl (uri) {
    if (typeof uri !== 'string') return null
    const match = /^spotify:([a-z]+):(.+)$/.exec(uri)
    return match ? 'https://open.spotify.com/' + match[1] + '/' + match[2] : null
  }

  function el (tag, className, text) {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text != null) node.textContent = text
    return node
  }

  const CONTEXT_ICON = 'M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z'

  function contextLine (context) {
    if (!context || !context.name) return null

    const ctx = el('div', 'ctx')

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    svg.setAttribute('width', '12')
    svg.setAttribute('height', '12')
    svg.setAttribute('viewBox', '0 0 24 24')
    svg.setAttribute('fill', 'currentColor')
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    path.setAttribute('d', CONTEXT_ICON)
    svg.appendChild(path)
    ctx.appendChild(svg)

    const url = spotifyUrl(context.uri)
    const name = el(url ? 'a' : 'span', null, context.name)
    if (url) {
      name.href = url
      name.target = '_blank'
      name.rel = 'noreferrer'
      name.style.color = 'inherit'
      name.style.textDecoration = 'none'
    }
    ctx.appendChild(name)

    if (typeof context.index === 'number' && context.index >= 0) {
      ctx.appendChild(el('span', null, '· track ' + (context.index + 1)))
    }

    return ctx
  }

  function card (friend, index) {
    const track = friend.track || {}
    const user = friend.user || {}

    const node = el('article', 'card')
    node.style.animationDelay = Math.min(index * 35, 400) + 'ms'

    const art = el('div', 'art')
    if (track.imageUrl) {
      const img = document.createElement('img')
      img.src = track.imageUrl
      img.alt = ''
      img.loading = 'lazy'
      img.referrerPolicy = 'no-referrer'
      img.addEventListener('error', () => { img.remove() })
      art.appendChild(img)
    } else {
      art.textContent = '♪'
    }

    const body = el('div', 'body')

    const row1 = el('div', 'row1')
    row1.appendChild(el('div', 'user', user.name || 'Someone'))

    const time = el('div', 'time', timeAgo(friend.timestamp))
    if (typeof friend.timestamp === 'number') {
      time.dataset.ts = String(friend.timestamp)
      time.title = new Date(friend.timestamp).toLocaleString()
    }
    row1.appendChild(time)
    body.appendChild(row1)

    const url = spotifyUrl(track.uri)
    if (url) {
      const link = el('a', 'track', track.name || 'Unknown track')
      link.href = url
      link.target = '_blank'
      link.rel = 'noreferrer'
      body.appendChild(link)
    } else {
      body.appendChild(el('div', 'track', track.name || 'Unknown track'))
    }

    if (track.artist && track.artist.name) {
      const artistUrl = spotifyUrl(track.artist.uri)
      if (artistUrl) {
        const link = el('a', 'artist', track.artist.name)
        link.href = artistUrl
        link.target = '_blank'
        link.rel = 'noreferrer'
        link.style.color = 'inherit'
        link.style.textDecoration = 'none'
        body.appendChild(link)
      } else {
        body.appendChild(el('div', 'artist', track.artist.name))
      }
    }

    const ctx = contextLine(track.context)
    if (ctx) body.appendChild(ctx)

    node.appendChild(art)
    node.appendChild(body)
    return node
  }

  function skeletons (count) {
    grid.replaceChildren()
    for (let i = 0; i < count; i++) grid.appendChild(el('div', 'skeleton'))
  }

  function errorCard (message) {
    const box = el('div', 'error')
    box.appendChild(el('strong', null, 'Could not load friend activity'))
    box.appendChild(document.createTextNode(message))
    grid.replaceChildren()
    grid.appendChild(box)
  }

  function render (friends) {
    if (!friends.length) {
      const box = el('div', 'empty')
      box.appendChild(el('strong', null, 'Nobody is listening right now'))
      box.appendChild(document.createTextNode('Your friends\' activity will show up here as they play something.'))
      grid.replaceChildren()
      grid.appendChild(box)
      return
    }

    const frag = document.createDocumentFragment()
    friends.forEach((friend, i) => frag.appendChild(card(friend, i)))
    grid.replaceChildren(frag)
  }

  function updateTimes () {
    document.querySelectorAll('.time[data-ts]').forEach((node) => {
      node.textContent = timeAgo(Number(node.dataset.ts))
    })
  }

  async function load () {
    if (loading) return
    loading = true
    refresh.disabled = true

    if (!lastUpdated) skeletons(6)

    try {
      const resp = await fetch('/api/activity', { cache: 'no-store' })
      const data = await resp.json()

      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status))

      lastUpdated = data.updatedAt || Date.now()
      render(data.friends || [])
      summary.textContent = (data.friends || []).length + ' friend' +
        ((data.friends || []).length === 1 ? '' : 's') + ' · updated ' + timeAgo(lastUpdated)
      footer.textContent = 'Auto-refreshes every 60 seconds'
    } catch (err) {
      errorCard(err.message)
      summary.textContent = 'Offline'
    } finally {
      loading = false
      refresh.disabled = false
    }
  }

  refresh.addEventListener('click', load)

  setInterval(() => {
    if (!document.hidden) load()
  }, REFRESH_MS)

  setInterval(updateTimes, TICK_MS)

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) load()
  })

  load()
</script>

</body>
</html>
